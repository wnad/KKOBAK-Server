spring:
  application:
    name: KKOBAK-Server
  profiles:
    active: dev  # 기본 프로파일 설정

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${KKOBAK_DB_HOST}:${KKOBAK_DB_PORT}/${KKOBAK_DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${KKOBAK_DB_USERNAME}
    password: ${KKOBAK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${KKOBAK_JWT_SECRET_KEY}
  issuer: ${KKOBAK_JWT_ISSUER}
  expiration: ${KKOBAK_JWT_EXPIRATION}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${KKOBAK_DB_HOST}:${KKOBAK_DB_PORT}/${KKOBAK_DB_NAME}
    username: ${KKOBAK_DB_USERNAME}
    password: ${KKOBAK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${KKOBAK_JWT_SECRET_KEY}
  issuer: ${KKOBAK_JWT_ISSUER}
  expiration: ${KKOBAK_JWT_EXPIRATION}