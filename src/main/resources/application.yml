spring:
  application:
    name: KKOBAK-Server
  profiles:
    active: dev  # 기본 프로파일 설정

---
spring:
  config:
    activate:
      on-profile: dev
      
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${KKOBAK_DB_HOST}:${KKOBAK_DB_PORT}/${KKOBAK_DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${KKOBAK_DB_USERNAME}
    password: ${KKOBAK_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  security:
    user:
      name: ${KKOBAK_SECURITY_NAME}
      password: ${KKOBAK_SECURITY_PASSWORD}

jwt:
  secret: ${KKOBAK_JWT_SECRET_KEY}
  issuer: ${KKOBAK_JWT_ISSUER}
  expiration: ${KKOBAK_JWT_EXPIRATION}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc.core: TRACE

