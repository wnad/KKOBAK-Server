upstream kkobak_frontend {
    # Swarm 서비스 이름: kkobak_kkobak-frontend,
    # 내부 Nginx가 80 포트로 서빙 중이므로 포트 80
    server kkobak_kkobak-frontend:80;
}

upstream kkobak_backend {
    # Swarm 서비스 이름: kkobak_kkobak-backend,
    # Spring Boot가 8080 포트로 서빙 중이므로 포트 8080
    server kkobak_kkobak-backend:8080;
}

server {
        listen 80;
        server_name kkobak.dundun213.com;

        return 301 https://$host$request$uri;
}

server {
        listen 80;
        server_name api.kkobak.dundun213.com;

        return 301 https://$host$request$uri;
}

server {
    listen 443 ssl;
    server_name kkobak.dundun213.com;

    # SSL 인증서 경로
    ssl_certificate     /etc/letsencrypt/live/kkobak.dundun213.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkobak.dundun213.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Proxy & SPA Fallback
    location / {
        proxy_pass         http://kkobak_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # index.html 직접 매핑
    location = /index.html {
        proxy_pass http://kkobak_frontend/index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.kkobak.dundun213.com;

    # SSL 인증서 경로
    ssl_certificate     /etc/letsencrypt/live/api.kkobak.dundun213.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kkobak.dundun213.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # API Proxy
    location / {
        proxy_pass         http://kkobak_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }
} 