spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${KKOBAK_DB_HOST}:${KKOBAK_DB_PORT}/${KKOBAK_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${KKOBAK_DB_USERNAME}
    password: ${KKOBAK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: ${KKOBAK_SECURITY_NAME}
      password: ${KKOBAK_SECURITY_PASSWORD}

jwt:
  secret: ${KKOBAK_JWT_SECRET_KEY}
  issuer: ${KKOBAK_JWT_ISSUER}
  expiration: ${KKOBAK_JWT_EXPIRATION}

